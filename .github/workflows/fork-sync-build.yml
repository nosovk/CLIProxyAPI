name: Fork Sync and Build

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Force build and publish Docker image
        type: boolean
        default: false
      skip_rebase:
        description: Build current branch without rebasing upstream
        type: boolean
        default: false
  push:
    branches: [feature/json-request-logging]
    paths-ignore: ['**.md', '.gitignore']

# One writer across sync, publish and proposal generation. Never cancel a push
# half way through publication. SHA pinning and explicit leases also protect
# against maintainer pushes, which do not participate in this lock.
concurrency:
  group: fork-sync-publish-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cli-proxy-api
  TARGET_BRANCH: feature/json-request-logging
  UPSTREAM_REPO: https://github.com/router-for-me/CLIProxyAPI.git
  UPSTREAM_BRANCH: dev
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  sync-and-test:
    if: github.repository == 'nosovk/CLIProxyAPI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      commit_sha: ${{ steps.sync.outputs.commit_sha }}
      commit_short_sha: ${{ steps.sync.outputs.commit_short_sha }}
      upstream_base: ${{ steps.sync.outputs.upstream_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Sync upstream and capture immutable build identity
        id: sync
        env:
          SKIP_REBASE: ${{ inputs.skip_rebase }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: bash scripts/fork-ci/sync.sh
      - name: Report rebase conflict
        if: failure() && steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          FORK_SHA: ${{ steps.sync.outputs.fork_sha }}
          CONFLICT_COMMIT: ${{ steps.sync.outputs.conflict_commit }}
          CONFLICT_FILES: ${{ steps.sync.outputs.conflict_files }}
        run: bash scripts/fork-ci/conflicts.sh
      # Setup after rebase: upstream may have changed go.mod's toolchain.
      - uses: actions/setup-go@v5
        if: steps.sync.outputs.should_build == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Offline fork CI regression tests
        if: steps.sync.outputs.should_build == 'true'
        run: python3 -m unittest discover -s scripts/fork-ci -p 'test_*.py' -v
      - name: Test, vet, build and race-check fork hot paths
        if: steps.sync.outputs.should_build == 'true'
        run: |
          bash scripts/fork-ci/test.sh
          go vet ./...
          go build -o "${RUNNER_TEMP}/cli-proxy-api" ./cmd/server
          go test -race ./sdk/cliproxy/auth ./sdk/api/handlers/openai ./internal/logging ./internal/api/middleware ./internal/util
      - name: Push verified rebase with captured lease
        if: steps.sync.outputs.should_build == 'true' && github.event_name != 'push'
        env:
          FORK_LEASE: ${{ steps.sync.outputs.fork_lease }}
          TESTED_SHA: ${{ steps.sync.outputs.commit_sha }}
        run: bash scripts/fork-ci/push-sync.sh
      - name: Close resolved conflict issues after tests and push
        if: steps.sync.outputs.should_build == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fork-ci/conflicts.sh close
      - uses: actions/upload-artifact@v4
        if: always() && steps.sync.outputs.should_build == 'true'
        with:
          name: go-test-logs
          path: test*.log
          if-no-files-found: ignore

  build-and-publish:
    needs: sync-and-test
    if: needs.sync-and-test.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-and-test.outputs.commit_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.TARGET_BRANCH }}
            type=raw,value=${{ needs.sync-and-test.outputs.commit_short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.sync-and-test.outputs.commit_sha }}
            org.opencontainers.image.version=${{ env.TARGET_BRANCH }}
            io.hex-drift.upstream-base=${{ needs.sync-and-test.outputs.upstream_base }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=fork-json-logging
            COMMIT=${{ needs.sync-and-test.outputs.commit_sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  propose-deploy:
    needs: [sync-and-test, build-and-publish]
    if: needs.sync-and-test.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_REPO: hex-drift/ai-gate
      DEPLOY_BRANCH: deploy/cli-proxy-api-bump
      NEW_TAG: ${{ needs.sync-and-test.outputs.commit_short_sha }}
      NEW_SHA: ${{ needs.sync-and-test.outputs.commit_sha }}
      NEW_BASE: ${{ needs.sync-and-test.outputs.upstream_base }}
      GH_TOKEN: ${{ secrets.AI_GATE_PR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: main
          token: ${{ secrets.AI_GATE_PR_TOKEN }}
          path: ai-gate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-and-test.outputs.commit_sha }}
          path: fork
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump exactly one image pin
        id: bump
        working-directory: ai-gate
        run: python3 ../fork/scripts/fork-ci/bump-image.py
      - name: Describe the tested commit and recorded upstream base
        if: steps.bump.outputs.changed == 'true'
        working-directory: fork
        env:
          OLD_TAG: ${{ steps.bump.outputs.old_tag }}
          BODY_FILE: ${{ runner.temp }}/deploy-body.md
        run: bash scripts/fork-ci/changelog.sh
      - name: Push proposal with a lease and open or update PR
        if: steps.bump.outputs.changed == 'true'
        working-directory: ai-gate
        env:
          OLD_TAG: ${{ steps.bump.outputs.old_tag }}
          BODY_FILE: ${{ runner.temp }}/deploy-body.md
        run: bash ../fork/scripts/fork-ci/propose-deploy.sh
